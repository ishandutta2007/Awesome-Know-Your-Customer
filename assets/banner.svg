<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 300"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0f172a"/><stop offset="50%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#0f172a"/></linearGradient><linearGradient id="accentGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#6366f1"/><stop offset="50%" stop-color="#a855f7"/><stop offset="100%" stop-color="#ec4899"/></linearGradient><linearGradient id="glowGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#38bdf8" stop-opacity=".4"/><stop offset="100%" stop-color="#818cf8" stop-opacity="0"/></linearGradient><style>@keyframes scan{0%{transform:translateY(-50px);opacity:.2}50%{opacity:.8}}@keyframes pulse{0%{opacity:.3;transform:scale(1)}50%{opacity:.7;transform:scale(1.05)}}@keyframes float{0%{transform:translateY(0)}50%{transform:translateY(-8px)}}.scan-line{animation:scan 4s ease-in-out infinite}.pulse-bg{animation:pulse 6s ease-in-out infinite;transform-origin:center}.floating-icon{animation:float 3s ease-in-out infinite}</style></defs><rect width="1200" height="300" fill="url(#bgGrad)" rx="16"/><circle cx="200" cy="150" r="180" fill="url(#glowGrad)" class="pulse-bg"/><circle cx="1000" cy="150" r="220" fill="url(#glowGrad)" class="pulse-bg" style="animation-delay:-3s"/><g stroke="#334155" stroke-width=".5" opacity=".3"><line x1="0" x2="1200" y1="60" y2="60"/><line x1="0" x2="1200" y1="120" y2="120"/><line x1="0" x2="1200" y1="180" y2="180"/><line x1="0" x2="1200" y1="240" y2="240"/><line x1="200" x2="200" y1="0" y2="300"/><line x1="400" x2="400" y1="0" y2="300"/><line x1="600" x2="600" y1="0" y2="300"/><line x1="800" x2="800" y1="0" y2="300"/><line x1="1000" x2="1000" y1="0" y2="300"/></g><line x1="0" x2="1200" y1="0" y2="0" stroke="url(#accentGrad)" stroke-width="3" class="scan-line"/><g class="floating-icon" transform="translate(940, 75)"><path fill="none" stroke="url(#acc